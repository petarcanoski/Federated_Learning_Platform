apiVersion: apps/v1
kind: Deployment
metadata:
  name: fl-backend
  namespace: fl-platform
  labels:
    app: fl-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fl-backend
  template:
    metadata:
      labels:
        app: fl-backend
    spec:
      containers:
        - name: backend
          image: user/fl-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MONGODB_URI
              value: "mongodb://fl-mongo-0.fl-mongo.fl-platform.svc.cluster.local:27017,fl-mongo-1.fl-mongo.fl-platform.svc.cluster.local:27017,fl-mongo-2.fl-mongo.fl-platform.svc.cluster.local:27017/fl_db?replicaSet=rs0"
            - name: MONGODB_DB_NAME
              value: "fl_db"
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

