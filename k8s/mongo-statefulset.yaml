apiVersion: v1
kind: Service
metadata:
  name: fl-mongo
  namespace: fl-platform
spec:
  clusterIP: None
  selector:
    app: fl-mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fl-mongo
  namespace: fl-platform
spec:
  serviceName: fl-mongo
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: fl-mongo
  template:
    metadata:
      labels:
        app: fl-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          command:
            - mongod
            - --replSet
            - rs0
            - --bind_ip_all
            - --port
            - "27017"
          ports:
            - containerPort: 27017
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mongosh --quiet --host 127.0.0.1 --eval "db.adminCommand('ping').ok === 1"
            initialDelaySeconds: 15
            periodSeconds: 10
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    if [ "$POD_NAME" = "fl-mongo-0" ]; then
                      until mongosh --quiet --host 127.0.0.1 --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; do
                        sleep 2
                      done
                      mongosh --quiet --host 127.0.0.1 --eval 'try { rs.status() } catch (e) { rs.initiate({_id:"rs0", members:[{_id:0, host:"fl-mongo-0.fl-mongo.fl-platform.svc.cluster.local:27017"},{_id:1, host:"fl-mongo-1.fl-mongo.fl-platform.svc.cluster.local:27017"},{_id:2, host:"fl-mongo-2.fl-mongo.fl-platform.svc.cluster.local:27017"}]}) }'
                    fi
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi


